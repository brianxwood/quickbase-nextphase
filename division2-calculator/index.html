<title>SHD Loadout Bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">

<style>
/* ============================================================
   Tokens — dark-first (the game's own HUD lives in the dark).
   Bare :root is the dark set; light is re-declared for viewers
   who ask for it, either by OS preference or explicit stamp.
   ============================================================ */
:root {
  --ground:      #12161b;
  --panel:       #1a2027;
  --raised:      #222b34;
  --sunken:      #0d1116;
  --line:        #2e3945;
  --line-soft:   #232c35;
  --ink:         #e6ebf1;
  --ink-mid:     #aab8c6;
  --ink-dim:     #7e8d9d;
  --accent:      #ff8a1f;
  --accent-soft: #3a2610;
  --accent-ink:  #1a1206;
  --good:        #3fb68b;
  --warn:        #e8b931;
  --bad:         #e0533f;
  --q-highend:   #f0b429;
  --q-named:     #e0882e;
  --q-exotic:    #ff5a36;
  --q-gearset:   #5fbf6a;
  --q-proto:     #9b8ad0;
  --q-plain:     #8ca0b3;
  --shadow:      0 1px 0 rgba(255,255,255,.03), 0 8px 24px rgba(0,0,0,.35);
  --focus:       #6fb7ff;

  color-scheme: dark;

  --f-display: "Barlow Condensed", "Arial Narrow", Helvetica, sans-serif;
  --f-body: "Barlow", ui-sans-serif, system-ui, sans-serif;
  --f-data: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --ground:      #eef0f3;
    --panel:       #ffffff;
    --raised:      #f5f7f9;
    --sunken:      #e4e8ed;
    --line:        #ccd5de;
    --line-soft:   #dfe5eb;
    --ink:         #161c23;
    --ink-mid:     #4a5764;
    --ink-dim:     #6a7886;
    --accent:      #b4560a;
    --accent-soft: #fbe9d6;
    --accent-ink:  #fff6ec;
    --good:        #16795a;
    --warn:        #8a6400;
    --bad:         #b63825;
    --q-highend:   #8f6a04;
    --q-named:     #96541a;
    --q-exotic:    #c0381a;
    --q-gearset:   #2d7a39;
    --q-proto:     #5c4a93;
    --q-plain:     #566674;
    --shadow:      0 1px 2px rgba(20,30,40,.06), 0 8px 20px rgba(20,30,40,.08);
    --focus:       #1863c4;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --ground:      #eef0f3;
  --panel:       #ffffff;
  --raised:      #f5f7f9;
  --sunken:      #e4e8ed;
  --line:        #ccd5de;
  --line-soft:   #dfe5eb;
  --ink:         #161c23;
  --ink-mid:     #4a5764;
  --ink-dim:     #6a7886;
  --accent:      #b4560a;
  --accent-soft: #fbe9d6;
  --accent-ink:  #fff6ec;
  --good:        #16795a;
  --warn:        #8a6400;
  --bad:         #b63825;
  --q-highend:   #8f6a04;
  --q-named:     #96541a;
  --q-exotic:    #c0381a;
  --q-gearset:   #2d7a39;
  --q-proto:     #5c4a93;
  --q-plain:     #566674;
  --shadow:      0 1px 2px rgba(20,30,40,.06), 0 8px 20px rgba(20,30,40,.08);
  --focus:       #1863c4;
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 1px;
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ---------- shared primitives ---------- */

.eyebrow {
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 11px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-dim);
}
.num { font-family: var(--f-data); font-variant-numeric: tabular-nums; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: .3em;
  font-family: var(--f-display);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  padding: 2px 7px;
  border: 1px solid var(--line);
  border-radius: 2px;
  color: var(--ink-mid);
  white-space: nowrap;
}

button {
  font-family: var(--f-display);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--ink-mid);
  background: var(--raised);
  border: 1px solid var(--line);
  border-radius: 2px;
  padding: 6px 11px;
  cursor: pointer;
}
button:hover { color: var(--ink); border-color: var(--ink-dim); }
button.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
}
button.primary:hover { filter: brightness(1.08); color: var(--accent-ink); }
button.ghost { background: transparent; }
button.danger:hover { color: var(--bad); border-color: var(--bad); }

/* Option groups wear the item quality colours the slot borders already use. Browsers vary in how
   much of a native popup they will style, so each rule stands on its own. */
optgroup {
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 12px;
  letter-spacing: .1em;
  text-transform: uppercase;
  background-color: var(--panel);
  color: var(--q-plain);
}
optgroup.q-gearset { color: var(--q-gearset); }
optgroup.q-exotic  { color: var(--q-exotic); }
optgroup.q-named   { color: var(--q-named); }
optgroup.q-highend { color: var(--q-highend); }
optgroup.q-proto   { color: var(--q-proto); }
optgroup.q-plain   { color: var(--q-plain); }
option {
  font-family: var(--f-body);
  font-weight: 400;
  font-size: 14px;
  letter-spacing: 0;
  text-transform: none;
  background-color: var(--panel);
  color: var(--ink);
}
/* Weapons are grouped by type, so quality rides on the option itself. Ordinary High-End stays
   in plain ink — only the ones worth spotting are tinted. */
option.q-exotic { color: var(--q-exotic); }
option.q-named  { color: var(--q-named); }
option.q-proto  { color: var(--q-proto); }

select, input[type="text"], input[type="number"] {
  font-family: var(--f-body);
  font-size: 13px;
  color: var(--ink);
  background: var(--sunken);
  border: 1px solid var(--line);
  border-radius: 2px;
  padding: 5px 7px;
  width: 100%;
  min-width: 0;
}
input[type="number"] { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
select:hover, input:hover { border-color: var(--ink-dim); }
input[type="range"] { accent-color: var(--accent); width: 100%; }
input[type="checkbox"] { accent-color: var(--accent); }
label { font-size: 13px; color: var(--ink-mid); }

/* ---------- app frame ---------- */

.app {
  max-width: 1660px;
  margin: 0 auto;
  padding-inline: 18px;
  padding-block: 0 56px;
}

.topbar {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 14px 20px;
  padding-block: 18px 12px;
  border-bottom: 1px solid var(--line);
}
.wordmark { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.wordmark h1 {
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 27px;
  letter-spacing: .03em;
  text-transform: uppercase;
  margin: 0;
  line-height: 1;
}
.wordmark h1 .slash { color: var(--accent); }
.wordmark p {
  margin: 0;
  font-size: 13px;
  color: var(--ink-dim);
  max-width: 52ch;
}
.tabs { display: flex; gap: 2px; margin-left: auto; }
.tabs button {
  border-radius: 2px 2px 0 0;
  border-bottom-color: transparent;
  background: transparent;
  padding: 7px 14px;
}
.tabs button[aria-selected="true"] {
  color: var(--accent);
  border-color: var(--line);
  border-bottom-color: var(--panel);
  background: var(--panel);
}

/* ---------- scenario bar ---------- */

.scenario {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(168px, 1fr));
  gap: 12px 20px;
  align-items: end;
  background: var(--panel);
  border: 1px solid var(--line);
  border-top: 2px solid var(--accent);
  padding: 12px 16px;
  margin-block: 14px;
  box-shadow: var(--shadow);
}
.scenario .field { display: flex; flex-direction: column; gap: 5px; }
.scenario .field > .eyebrow { display: flex; justify-content: space-between; gap: 8px; }
.seg { display: flex; }
.seg button {
  flex: 1;
  border-radius: 0;
  margin-left: -1px;
  padding: 6px 4px;
  letter-spacing: .04em;
}
.seg button:first-child { margin-left: 0; border-radius: 2px 0 0 2px; }
.seg button:last-child { border-radius: 0 2px 2px 0; }
.seg button[aria-pressed="true"] {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
  position: relative;
  z-index: 1;
}
.toggles { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.toggles label { display: flex; align-items: center; gap: 6px; cursor: pointer; }

/* ---------- build view: three zones ---------- */

.build-view {
  display: grid;
  grid-template-columns: 234px minmax(0, 1fr) 366px;
  gap: 16px;
  align-items: start;
}
@media (max-width: 1280px) {
  .build-view { grid-template-columns: 232px minmax(0, 1fr); }
  .readout { grid-column: 1 / -1; }
}
@media (max-width: 860px) {
  .build-view { grid-template-columns: minmax(0, 1fr); }
}

.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
}
.panel > header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 12px;
  border-bottom: 1px solid var(--line-soft);
}
.panel > header h2 {
  font-family: var(--f-display);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  margin: 0;
}
.panel > header .spacer { margin-left: auto; }
.panel .body { padding: 12px; }

/* loadout rail */
.rail { position: sticky; top: 8px; }
.loadouts { display: flex; flex-direction: column; }
.loadout {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 2px 8px;
  align-items: center;
  padding: 9px 12px;
  border-left: 3px solid transparent;
  border-bottom: 1px solid var(--line-soft);
}
.loadout:hover { background: var(--raised); }
.loadout[aria-current="true"] {
  border-left-color: var(--accent);
  background: var(--raised);
}
.loadout .lpick {
  background: none;
  border: 0;
  padding: 0;
  text-align: left;
  font-family: var(--f-display);
  font-size: 15px;
  font-weight: 600;
  letter-spacing: .02em;
  text-transform: none;
  color: var(--ink);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  cursor: pointer;
}
.loadout[aria-current="true"] .lpick { color: var(--accent); }
.loadout .lmeta {
  grid-column: 2;
  font-family: var(--f-data);
  font-size: 11px;
  color: var(--ink-dim);
  font-variant-numeric: tabular-nums;
}
.loadout input[type="checkbox"] { width: auto; }

/* gear + weapon cards */
.slot-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 12px;
}
.slot {
  background: var(--raised);
  border: 1px solid var(--line-soft);
  border-left: 3px solid var(--q-plain);
  padding: 10px 11px;
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.slot.q-highend { border-left-color: var(--q-highend); }
.slot.q-named   { border-left-color: var(--q-named); }
.slot.q-exotic  { border-left-color: var(--q-exotic); }
.slot.q-gearset { border-left-color: var(--q-gearset); }
.slot.q-proto   { border-left-color: var(--q-proto); }
.slot > .slot-head {
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.slot > .slot-head .name {
  font-family: var(--f-display);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
}
.slot > .slot-head .armor {
  margin-left: auto;
  font-family: var(--f-data);
  font-size: 12px;
  color: var(--ink-dim);
  font-variant-numeric: tabular-nums;
}
.attr-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 76px;
  gap: 6px;
}
.attr-row.locked select, .attr-row.locked input { opacity: .72; }
.row-label {
  display: grid;
  grid-template-columns: 72px minmax(0, 1fr);
  gap: 8px;
  align-items: center;
}
.row-label > .eyebrow { font-size: 10px; }
.hint { font-size: 12px; color: var(--ink-dim); }
.hint.computed {
  border-left: 2px solid var(--accent);
  padding-left: 8px;
  color: var(--ink-mid);
}
.talent-desc {
  font-size: 12.5px;
  color: var(--ink-mid);
  border-left: 2px solid var(--line);
  padding-left: 8px;
  margin: 0;
}

/* bonus pips */
.bonuslist { display: flex; flex-direction: column; gap: 8px; }
.bonus {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 2px 10px;
  padding-bottom: 7px;
  border-bottom: 1px solid var(--line-soft);
}
.bonus:last-child { border-bottom: 0; padding-bottom: 0; }
.bonus .bname {
  font-family: var(--f-display);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: .04em;
}
.pips { display: flex; gap: 3px; align-self: center; }
.pip {
  width: 14px; height: 6px;
  background: var(--sunken);
  border: 1px solid var(--line);
}
.pip.on { background: var(--accent); border-color: var(--accent); }
.bonus .blines {
  grid-column: 1 / -1;
  font-family: var(--f-data);
  font-size: 11.5px;
  color: var(--ink-dim);
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.bonus .blines .live { color: var(--good); }
.bonus .blines em { font-style: normal; color: var(--warn); }
.bonus .blines .detail { padding-left: 1.6em; color: var(--ink-mid); }

/* readout */
.readout { position: sticky; top: 8px; display: flex; flex-direction: column; gap: 16px; }

.readout-main {
  border-top: 3px solid var(--accent);
  box-shadow: 0 0 0 1px var(--accent-soft), var(--shadow);
}
.readout-main > header { border-bottom-color: var(--line); }
.readout-main > header h2 { font-size: 14px; color: var(--ink); }

.hero {
  display: block;
  padding: 14px 16px 12px;
  background: var(--sunken);
  border-bottom: 1px solid var(--line);
}
.hero .k { display: block; font-size: 11px; }
.hero .v {
  display: block;
  font-family: var(--f-data);
  font-weight: 700;
  font-size: clamp(38px, 7vw, 50px);
  line-height: 1.02;
  letter-spacing: -.02em;
  color: var(--accent);
  margin-block: 2px 4px;
}
.hero .sub {
  display: block;
  font-family: var(--f-data);
  font-size: 11.5px;
  color: var(--ink-dim);
  overflow: hidden;
  text-overflow: ellipsis;
}

/* A range, not a progress meter: the track spans resting to fully-procced damage and the pin
   marks where the chosen uptime lands. Recessive track, one accent mark, labels in ink tokens. */
.range { margin-top: 11px; }
.range-track {
  position: relative;
  height: 6px;
  background: var(--line-soft);
  border: 1px solid var(--line);
  border-radius: 3px;
}
.range-fill {
  position: absolute;
  inset: 0 auto 0 0;
  background: var(--accent-soft);
  border-radius: 3px 0 0 3px;
}
.range-pin {
  position: absolute;
  top: -3px;
  width: 3px;
  height: 10px;
  margin-left: -1px;
  background: var(--accent);
  border-radius: 1px;
}
.range-ends {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-top: 4px;
  font-family: var(--f-data);
  font-size: 10.5px;
  color: var(--ink-dim);
}

.headline {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
}
.headline > div {
  padding: 9px 12px;
  border-right: 1px solid var(--line-soft);
}
.headline > div:last-child { border-right: 0; }
.headline .k { display: block; font-size: 10px; }
.headline .v {
  display: block;
  font-family: var(--f-data);
  font-weight: 700;
  font-size: 21px;
  font-variant-numeric: tabular-nums;
  line-height: 1.2;
}
.headline .sub { display: block; font-family: var(--f-data); font-size: 11px; color: var(--ink-dim); }

.statlist { display: flex; flex-direction: column; }
.statlist .srow {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 10px;
  align-items: baseline;
  padding: 4px 12px;
  border-bottom: 1px solid var(--line-soft);
  font-size: 13px;
}
.statlist .srow:last-child { border-bottom: 0; }
.statlist .srow.group {
  background: var(--sunken);
  border-bottom: 1px solid var(--line);
}
.statlist .srow .sv {
  font-family: var(--f-data);
  font-variant-numeric: tabular-nums;
  font-weight: 500;
}
.statlist .srow.zero .sv { color: var(--ink-dim); }
.statlist .srow.capped .sv { color: var(--warn); }
.statlist .srow .proc, .chip .proc { color: var(--good); margin-left: .45em; font-size: .86em; }

/* weapon cards */
.wpn-figures {
  display: grid;
  /* six figures, deliberately 3 x 2 — auto-fit packed them 4 + 2 */
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 1px;
  background: var(--line-soft);
  border: 1px solid var(--line-soft);
}
.wpn-figures > div {
  background: var(--panel);
  padding: 6px 8px;
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.wpn-figures .k {
  display: block;
  font-size: 10px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.wpn-figures .v {
  display: block;
  font-family: var(--f-data);
  font-size: 14px;
  line-height: 1.2;
  font-variant-numeric: tabular-nums;
}
.wpn-figures .v.em { color: var(--accent); font-weight: 700; }

/* spec + watch */
.perk-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(252px, 1fr)); gap: 9px; }
.perk {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 96px;
  gap: 3px 10px;
  align-items: center;
  background: var(--raised);
  border: 1px solid var(--line-soft);
  padding: 7px 9px;
}
.perk .pname { font-family: var(--f-display); font-weight: 600; font-size: 14px; letter-spacing: .03em; }
.perk .pdesc { grid-column: 1 / -1; font-size: 12px; color: var(--ink-dim); }
.perk .tierpick { display: flex; gap: 2px; justify-self: end; }
.perk .tierpick button { padding: 3px 8px; font-size: 11px; }
.perk .tierpick button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.perk .tierpick button[disabled] { opacity: .4; cursor: not-allowed; }
.perk.blocked { opacity: .62; }

.watch-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(224px, 1fr)); gap: 14px; }
.watch-cat > .eyebrow { display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 4px; margin-bottom: 6px; }
.watch-row { display: grid; grid-template-columns: minmax(0, 1fr) 62px 58px; gap: 7px; align-items: center; font-size: 13px; padding: 2px 0; }
.watch-row .wv { font-family: var(--f-data); font-size: 12px; color: var(--good); font-variant-numeric: tabular-nums; text-align: right; }

/* ---------- compare matrix ---------- */

.matrix-wrap { overflow-x: auto; }
table.matrix { border-collapse: collapse; width: 100%; font-size: 13.5px; }
table.matrix th, table.matrix td {
  border: 1px solid var(--line-soft);
  padding: 6px 10px;
  text-align: right;
  white-space: nowrap;
}
table.matrix thead th {
  position: sticky; top: 0;
  background: var(--raised);
  font-family: var(--f-display);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: .06em;
  text-align: right;
  z-index: 2;
}
table.matrix th[scope="row"] {
  text-align: left;
  font-family: var(--f-body);
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-mid);
  position: sticky; left: 0;
  background: var(--panel);
  z-index: 1;
}
table.matrix tr.section th {
  background: var(--sunken);
  font-family: var(--f-display);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-dim);
}
table.matrix td { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
